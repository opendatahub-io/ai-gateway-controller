apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
  annotations:
    maas.opendatahub.io/ipp-profile: praxis
data:
  # Pre-auth (BBR): extract JSON body "model" → X-Gateway-Model-Name so gateway
  # HTTPRoute rules can match POST /v1/chat/completions at gateway root.
  pre-extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: bbr
        filters:
          - filter: model_to_header
            header: X-Gateway-Model-Name

    insecure_options:
      allow_unbounded_body: true

  # Post-auth (IPP): request correlation + LLMIS body rewrite for BBR.
  # llmisvc_model_provider_resolver rewrites body "model" from publisher ID to
  # short name while leaving X-Gateway-Model-Name unchanged for KServe routing.
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: ipp
        filters:
          - filter: request_id
          - filter: llmisvc_model_provider_resolver
            header: X-Gateway-Model-Name

    insecure_options:
      allow_unbounded_body: true
