apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: demo
  namespace: models-as-a-service
spec:
  modelRef:
    kind: ExternalModel
    name: demo-model
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: kind-e2e-subscription
  namespace: models-as-a-service
spec:
  owner:
    users:
      - kind-user
  modelRefs:
    - name: demo
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 10000
          window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: kind-e2e-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: demo
      namespace: models-as-a-service
  subjects:
    users:
      - kind-user
