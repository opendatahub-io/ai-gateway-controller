# Purpose: Attaches a token-rate-limit policy to tenant A's generated
# ExternalModel HTTPRoute.
#
# Scope: Kind E2E fixture only. This is not a production deployment manifest.
#
# Dependencies: Requires the models-as-a-service namespace, the MaaS API and
# Authorino/Kuadrant controllers, and the generated external-model-demo-model
# HTTPRoute from the tenant-A fixtures.
#
# Qualification role: exercises MaaS-managed model authorization from
# 40-maas-fixtures.yaml and keeps the independent tenant-A rate-limit policy.
# Do not add a route-targeted AuthPolicy here: it conflicts with MaaS policy
# generation and only checking key validity would bypass model authorization.
---
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: external-model-rate-limit
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/managed-by: local-env
spec:
  limits:
    external-model:
      counters:
        - expression: auth.identity.userid
      rates:
        - limit: 10000
          window: 1m
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: external-model-demo-model
