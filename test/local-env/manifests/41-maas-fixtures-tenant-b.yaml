apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: demo
  namespace: ai-tenant-tenant-b
spec:
  modelRef:
    kind: ExternalModel
    name: demo-model
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: kind-e2e-subscription
  namespace: ai-tenant-tenant-b
spec:
  owner:
    users: [kind-user]
  modelRefs:
  - name: demo
    namespace: ai-tenant-tenant-b
    tokenRateLimits:
    - limit: 10000
      window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: kind-e2e-access
  namespace: ai-tenant-tenant-b
spec:
  modelRefs:
  - name: demo
    namespace: ai-tenant-tenant-b
  subjects:
    users: [kind-user]
