# Purpose: Configures tenant-A MaaS model-reference, subscription, and
# authentication-policy resources for `models-as-a-service`.
#
# Scope: Kind E2E fixture only. This is not a production deployment manifest.
#
# Dependencies: Requires 20-fixtures.yaml's demo-model, the models-as-a-service
# namespace, the MaaS API/controller, and the generated HTTPRoute. The
# MaaSAuthPolicy below is the sole model authorization policy; the harness must
# not add a route AuthPolicy that conflicts with MaaS policy generation.
#
# Qualification role: Supplies the tenant-A subscription and model-scoped
# MaaSAuthPolicy used by the normal Gateway authorization test. `kind-user`
# and related values are test-only identities.

apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: demo
  namespace: models-as-a-service
spec:
  modelRef:
    kind: ExternalModel
    name: demo-model
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: kind-e2e-subscription
  namespace: models-as-a-service
spec:
  owner:
    users:
      - kind-user
  modelRefs:
    - name: demo
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 10000
          window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: kind-e2e-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: demo
      namespace: models-as-a-service
  subjects:
    users:
      - kind-user
