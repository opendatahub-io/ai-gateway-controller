name: GitHub Actions Security Analysis (zizmor)

# zizmor is a security-focused SAST for workflow files (template injection,
# unpinned actions, excessive permissions, credential leakage) — this repo
# uses it instead of actionlint, trading actionlint's syntax/expression
# correctness checks for security coverage.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

env:
  ZIZMOR_VERSION: 1.29.0

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif to upload SARIF files.
      contents: read
      actions: read # Needed for upload-sarif to read workflow run info on private repos.
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run zizmor
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: zizmor
