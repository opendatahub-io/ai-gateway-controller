apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: maas-system
  labels:
    app.kubernetes.io/managed-by: local-env
    gateway.networking.k8s.io/gateway-name: maas-default-gateway
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: Service
metadata:
  name: maas-tenant-b-gateway
  namespace: maas-system
  labels:
    app.kubernetes.io/managed-by: local-env
    gateway.networking.k8s.io/gateway-name: maas-tenant-b-gateway
spec:
  selector:
    gateway.networking.k8s.io/gateway-name: maas-tenant-b-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 80
---
