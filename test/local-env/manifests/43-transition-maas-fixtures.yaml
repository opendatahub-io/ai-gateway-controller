apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: transition-model
  namespace: ai-tenant-transition
spec:
  modelRef:
    kind: ExternalModel
    name: transition-model
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: transition-subscription
  namespace: ai-tenant-transition
spec:
  owner:
    users:
      - kind-user
  modelRefs:
    - name: transition-model
      namespace: ai-tenant-transition
      tokenRateLimits:
        - limit: 10000
          window: 1m
  priority: 10
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: transition-access
  namespace: ai-tenant-transition
spec:
  modelRefs:
    - name: transition-model
      namespace: ai-tenant-transition
  subjects:
    users:
      - kind-user
