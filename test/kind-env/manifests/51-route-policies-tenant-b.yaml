# Purpose: Attaches a token-rate-limit policy to tenant B's generated
# ExternalModel HTTPRoute.
#
# Scope: Kind E2E fixture only. This is not a production deployment manifest.
#
# Dependencies: Requires the ai-tenant-tenant-b namespace, the MaaS API and
# Authorino/Kuadrant controllers, and the tenant-B generated
# external-model-demo-model HTTPRoute from 21-fixtures-tenant-b.yaml.
#
# Qualification role: relies on the tenant-B MaaSAuthPolicy in
# 41-maas-fixtures-tenant-b.yaml and keeps its independent rate-limit policy.
# Do not add a route-targeted AuthPolicy here: it conflicts with MaaS policy
# generation and only checking key validity would bypass model authorization.
---
apiVersion: kuadrant.io/v1alpha1
kind: TokenRateLimitPolicy
metadata:
  name: external-model-rate-limit
  namespace: ai-tenant-tenant-b
  labels: {app.kubernetes.io/managed-by: local-env}
spec:
  limits:
    external-model:
      counters:
      - expression: auth.identity.userid
      rates:
      - limit: 10000
        window: 1m
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: external-model-demo-model
